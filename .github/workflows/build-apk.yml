# Build the supplier app APK by hand (PLAN.md decision 12: APK first, Play later).
# The API address comes from repository variables (Settings -> Variables):
# a build of `main` uses SUPPLY_API_URL_PROD (https://supplier.sribeesonline.com/api),
# any other branch SUPPLY_API_URL (https://devsupply.sribees.com/api). Signing: the release
# keystore comes from secrets SUPPLIER_KEYSTORE_B64 / _PASSWORD / _ALIAS. A build of main
# without them fails (an APK signed by another key cannot update the installed app);
# other branches fall back to the debug key.
name: Build supplier APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9  # pinned like the Price app (3.50 broke builds)
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Version from pubspec
        id: v
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Release keystore
        env:
          KS_B64: ${{ secrets.SUPPLIER_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.SUPPLIER_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SUPPLIER_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "main must be release-signed: set the SUPPLIER_KEYSTORE_* secrets"; exit 1
            fi
            echo "no release keystore: this APK is debug-signed"; exit 0
          fi
          echo "$KS_B64" | base64 -d > android/upload.jks
          umask 077
          {
            echo "storePassword=$KS_PASSWORD"
            echo "keyPassword=$KS_PASSWORD"
            echo "keyAlias=$KS_ALIAS"
            echo "storeFile=upload.jks"
          } > android/key.properties
      - name: Build APK
        env:
          SUPPLY_API_URL: ${{ github.ref_name == 'main' && vars.SUPPLY_API_URL_PROD || vars.SUPPLY_API_URL }}
        run: |
          test -n "$SUPPLY_API_URL" || { echo "set the SUPPLY_API_URL repository variable"; exit 1; }
          flutter build apk --release \
            --dart-define=SUPPLY_API_URL="$SUPPLY_API_URL" \
            --dart-define=APP_VERSION="${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sribees-supplier-${{ steps.v.outputs.version }}-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
